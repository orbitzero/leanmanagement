{% extends 'base.html' %}{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
<h1>Sign in</h1><p class="sub">Local test mode - no password. Microsoft sign-in comes later (see README).</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Work email</label><input name="email" type="email" required autofocus>
<label>Your name <small>(first time only)</small></label><input name="name">
<label>Your team <small>(first time only)</small></label><input name="team" placeholder="e.g. Marketing">
<p><button>Continue</button></p></form></div>{% endblock %}
